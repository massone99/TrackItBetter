name: Android release

on:
  push:
    branches: [main]
    paths:
      - app.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check code
        run: |
          npm run typecheck
          npm run lint
          npm test -- --ci
      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
      - name: Build arm64 APK
        run: npm run build:apk
      - name: Verify signing certificate matches v0.2.2
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p previous
          gh release download v0.2.2 --pattern 'TrackItBetter-0.2.2.apk' --dir previous
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$apksigner"
          previous_cert=$("$apksigner" verify --print-certs previous/TrackItBetter-0.2.2.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          current_cert=$("$apksigner" verify --print-certs "build/TrackItBetter-${VERSION}.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          test -n "$previous_cert"
          test "$previous_cert" = "$current_cert"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v${VERSION}" "build/TrackItBetter-${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "TrackItBetter ${VERSION}" \
            --notes "Sideloadable Android APK (arm64-v8a). The training calendar now keeps selected dates and workout markers readable in light and dark themes, and adjacent-month dates retain clear contrast."
