name: Android release

on:
  push:
    branches: [main]
    paths:
      - app.json
      - .github/workflows/android-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check code
        run: |
          npm run typecheck
          npm run lint
          npm test -- --ci
      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
      - name: Read release notes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const { expo: { version } } = JSON.parse(readFileSync('app.json', 'utf8'));
          const lines = readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n').split('\n');
          const start = lines.findIndex((line) => line.startsWith(`## ${version} - `));
          if (start < 0) throw new Error(`Missing CHANGELOG.md entry for ${version}`);
          const end = lines.findIndex((line, index) => index > start && line.startsWith('## '));
          const notes = lines.slice(start + 1, end < 0 ? undefined : end).join('\n').trim();
          if (!notes) throw new Error(`Empty CHANGELOG.md entry for ${version}`);
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-notes.md'), `${notes}\n`);
          NODE
      - name: Build arm64 APK
        run: npm run build:apk
      - uses: actions/upload-artifact@v4
        with:
          name: TrackItBetter-${{ steps.version.outputs.value }}-apk
          path: build/TrackItBetter-${{ steps.version.outputs.value }}.apk
          if-no-files-found: error
      - name: Verify signing certificate matches v0.2.2
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p previous
          gh release download v0.2.2 --pattern 'TrackItBetter-0.2.2.apk' --dir previous
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner=$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [[ -z "$apksigner" ]]; then echo "::error::apksigner unavailable in $sdk"; exit 1; fi
          previous_info=$("$apksigner" verify --print-certs previous/TrackItBetter-0.2.2.apk)
          current_info=$("$apksigner" verify --print-certs "build/TrackItBetter-${VERSION}.apk")
          echo "Previous APK: $previous_info"
          echo "Current APK: $current_info"
          previous_cert=$(echo "$previous_info" | sed -nE 's/^.*[Ss]igner.*certificate SHA-256 digest: //p' | head -n 1)
          current_cert=$(echo "$current_info" | sed -nE 's/^.*[Ss]igner.*certificate SHA-256 digest: //p' | head -n 1)
          if [[ -z "$previous_cert" || -z "$current_cert" ]]; then echo "::error::Could not read APK signing certificates"; exit 1; fi
          if [[ "$previous_cert" != "$current_cert" ]]; then echo "::error::APK signature differs from v0.2.2"; exit 1; fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v${VERSION}" "build/TrackItBetter-${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "TrackItBetter ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
